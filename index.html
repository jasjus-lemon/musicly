<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Musicly</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            MUSIC<span>LY</span>
        </div>

        <nav>
            <button class="nav active">⌂ Home</button>
            <button class="nav" onclick="focusSearch()">⌕ Search</button>
            <button class="nav">♫ Your Library</button>
        </nav>

        <div class="library">

            <p>YOUR LIBRARY</p>

            <button>♡ Liked Songs</button>
            <button>◷ Recently Played</button>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <button class="back">‹</button>
            <button class="forward">›</button>

            <div class="search">

                <span>⌕</span>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="What do you want to listen to?"
                >

                <button onclick="searchMusic()">
                    Search
                </button>

            </div>

        </header>


        <!-- HOME -->

        <section class="hero">

            <div>

                <p class="welcome">
                    YOUR MUSIC SPACE
                </p>

                <h1>
                    Music<br>
                    for your mood.
                </h1>

                <p>
                    Cari lagu favoritmu dan dengarkan
                    preview langsung dari Musicly.
                </p>

            </div>

        </section>


        <!-- QUICK ACCESS -->

        <section class="section">

            <h2>Quick Access</h2>

            <div class="quick-grid">

                <div class="quick-card">
                    <div class="quick-icon">♡</div>
                    <span>Liked Songs</span>
                </div>

                <div class="quick-card">
                    <div class="quick-icon">◷</div>
                    <span>Recently Played</span>
                </div>

                <div class="quick-card">
                    <div class="quick-icon">♫</div>
                    <span>Your Music</span>
                </div>

            </div>

        </section>


        <!-- SEARCH RESULTS -->

        <section class="section">

            <div class="section-title">

                <h2>Search Results</h2>

                <span id="resultCount"></span>

            </div>

            <div id="result">

                <div class="empty">
                    🔎 Search for your favorite song
                </div>

            </div>

        </section>


        <div class="bottom-space"></div>

    </main>

</div>


<!-- NOW PLAYING -->

<div class="player">

    <div class="now-playing">

        <img
            id="playerCover"
            src="art.jpg"
            alt="Cover"
        >

        <div>

            <strong id="songTitle">
                Nothing Playing
            </strong>

            <p id="artist">
                Choose a song
            </p>

        </div>

    </div>


    <div class="controls">

        <button onclick="previousSong()">⏮</button>

        <button
            class="main-play"
            onclick="playMusic()"
            id="playButton"
        >
            ▶
        </button>

        <button onclick="nextSong()">⏭</button>

    </div>


    <div class="volume">

        🔊

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
